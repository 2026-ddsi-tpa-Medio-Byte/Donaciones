# Perfil "test": base H2 en memoria para tests de integración (no afecta produccion/Render)
spring.datasource.url=jdbc:h2:mem:donaciones;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Sin export a Datadog durante los tests
management.datadog.metrics.export.enabled=false
